<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="irvalidate: Validate Iranian data. Zero dependencies.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#18284a"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect y="0" width="400" height="9" fill="#239f40"/>
    <rect x="400" y="0" width="400" height="9" fill="#ffffff"/>
    <rect x="800" y="0" width="400" height="9" fill="#da0000"/>
  </g>

  <g font-family="SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="58" y="150" font-size="84" font-weight="700"><tspan fill="#3ddc84">ir</tspan><tspan fill="#ffffff">validate</tspan></text>
  </g>
  <text x="60" y="200" font-size="30" fill="#c9d4e5" font-family="Segoe UI, Helvetica, Arial, sans-serif">Validate Iranian data. Zero dependencies.</text>

  <g font-family="SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#e6edf7">
    <g>
      <rect x="60" y="226" width="151" height="36" rx="18" fill="#22345c"/><text x="76" y="250">National ID</text>
      <rect x="221" y="226" width="75" height="36" rx="18" fill="#22345c"/><text x="237" y="250">Card</text>
      <rect x="306" y="226" width="86" height="36" rx="18" fill="#22345c"/><text x="322" y="250">Sheba</text>
      <rect x="402" y="226" width="97" height="36" rx="18" fill="#22345c"/><text x="418" y="250">Mobile</text>
    </g>
    <g>
      <rect x="60" y="272" width="118" height="36" rx="18" fill="#22345c"/><text x="76" y="296">Landline</text>
      <rect x="188" y="272" width="151" height="36" rx="18" fill="#22345c"/><text x="204" y="296">Postal code</text>
    </g>
  </g>

  <g>
    <rect x="720" y="62" width="420" height="216" rx="14" fill="#080d18" stroke="#2c3f6b" stroke-width="2"/>
    <circle cx="746" cy="88" r="6" fill="#ff5f56"/><circle cx="768" cy="88" r="6" fill="#ffbd2e"/><circle cx="790" cy="88" r="6" fill="#27c93f"/>
    <g font-family="SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="20">
      <text x="746" y="140"><tspan fill="#6b7a99">&gt;&gt;&gt; </tspan><tspan fill="#e6edf7">r = </tspan><tspan fill="#7dd3fc">validate_sheba</tspan><tspan fill="#e6edf7">(x)</tspan></text>
      <text x="746" y="173"><tspan fill="#6b7a99">&gt;&gt;&gt; </tspan><tspan fill="#e6edf7">r.ok</tspan></text>
      <text x="746" y="203"><tspan fill="#ff6b6b">False</tspan></text>
      <text x="746" y="236"><tspan fill="#6b7a99">&gt;&gt;&gt; </tspan><tspan fill="#e6edf7">r.code</tspan></text>
      <text x="746" y="266"><tspan fill="#fbbf24">'bad_checksum'</tspan></text>
    </g>
  </g>
</svg>
