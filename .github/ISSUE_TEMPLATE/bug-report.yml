name: Bug report / گزارش باگ
description: Something returns a wrong result or crashes
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please **do not paste real personal data** (national IDs, card or account numbers). Use invented or generated values, for example from `irvalidate <kind> --generate`.
        لطفاً داده‌ی شخصی واقعی نذار؛ از مقدار ساختگی یا `--generate` استفاده کن.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal example
      render: python
      placeholder: |
        from irvalidate import validate_national_id
        validate_national_id("...")
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: irvalidate version and Python version
      placeholder: "0.3.0, Python 3.12"
    validations:
      required: true
