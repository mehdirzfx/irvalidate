name: Publish to PyPI

# با ساختن Release در گیت‌هاب، پکیج خودکار روی PyPI منتشر می‌شود.
# نکته: نسخه‌ی پکیج از src/irvalidate/__init__.py خوانده می‌شود و PyPI اجازه‌ی
# آپلود دوباره‌ی یک نسخه را نمی‌دهد؛ پس قبل از هر Release نسخه را بالا ببرید.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing (بدون نیاز به توکن)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(grep -oP '__version__ = "\K[^"]+' src/irvalidate/__init__.py)
          echo "release tag: $TAG | package version: v$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package version v$VERSION. Bump __version__ in src/irvalidate/__init__.py, commit and push, then recreate the release."
            exit 1
          fi
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
