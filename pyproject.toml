[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "irvalidate"
dynamic = ["version"]
description = "Validation of Iranian data: national ID, card number, Sheba (IBAN), mobile, postal code. اعتبارسنجی کد ملی، کارت، شبا، موبایل، تلفن ثابت و کد پستی"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "mehdirzfx", email = "semicalon@outlook.com" }]
keywords = ["pydantic", "django", "fastapi", "iran", "persian", "farsi", "validation", "national-id", "sheba", "iban", "کد ملی", "شبا"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
django = ["django>=4.2"]
wtforms = ["wtforms>=3"]
dev = ["pytest>=7", "pydantic>=2", "django>=4.2", "wtforms>=3", "build", "twine"]

[project.scripts]
irvalidate = "irvalidate.cli:main"

[project.urls]
Homepage = "https://github.com/mehdirzfx/irvalidate"
Issues = "https://github.com/mehdirzfx/irvalidate/issues"
Changelog = "https://github.com/mehdirzfx/irvalidate/blob/main/CHANGELOG.md"
Persian-README = "https://github.com/mehdirzfx/irvalidate/blob/main/README.fa.md"

[tool.hatch.version]
path = "src/irvalidate/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
